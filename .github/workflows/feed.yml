name: Feed aktualisieren

on:
  schedule:
    - cron: "23 4 * * *"   # täglich ca. 06:23 MESZ
  workflow_dispatch:        # manuell über "Run workflow"

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Feed erzeugen
        run: |
          python fba_de_feed.py \
            --out feed.xml --state state.json --excluded excluded.txt \
            --self-url "https://raw.githubusercontent.com/${{ github.repository }}/main/feed.xml"
      - name: Änderungen committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml state.json excluded.txt
          git diff --cached --quiet || git commit -m "Feed aktualisiert"
          git push
